# Verificación local: API + SQL Server en contenedores.
# Uso:  cp .env.example .env  &&  docker compose up --build
# Swagger: http://localhost:8080/swagger
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 20s

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Default: "Server=db,1433;Database=Dsw2025TpiDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True"
      Cors__AllowedOrigins__0: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "8080:8080"
